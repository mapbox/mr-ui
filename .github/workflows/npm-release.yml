name: NPM release

on:
  push:
    tags:
      - '*'

env:
  CI: true

jobs:
  publish:
    name: "Publish ${{ github.ref_name }}"
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Extract package version from package.json
        run: |
          packageVersion=$(jq -r .version package.json)
          echo "versionTag=v$packageVersion" >> "$GITHUB_ENV"

      - name: Verify tag matches package.json version
        if: ${{ github.ref_name != env.versionTag }}
        run: |
          echo "Tag ${{ github.ref_name }} does not match package.json version (expected ${{ env.versionTag }})."
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Upgrade npm for OIDC trusted publishing support
        run: npm install -g npm@^11.5.1

      - name: Install npm dependencies
        run: npm ci --no-fund --no-audit --prefer-offline

      - name: Build publishable package
        # Publishes from pkg/, not the repo root - see scripts/build-package.js.
        # This compiles src/components into pkg/, with a package.json that has
        # `private`/`scripts`/`devDependencies` stripped out.
        run: npm run build

      - name: Release production
        if: ${{ !contains(github.ref_name, '.dev') && !contains(github.ref_name, '-dev') }}
        working-directory: pkg
        run: npm publish

      - name: Release development
        if: ${{ contains(github.ref_name, '.dev') || contains(github.ref_name, '-dev') }}
        working-directory: pkg
        run: npm publish --tag dev
